services:
  # --- Main Application Service ---
  aac-lyndrix-core:
    image: "ghcr.io/lyndrix-platform/lyndrix-core:1.12.0"
    container_name: "aac-lyndrix-core"
    hostname: "lyndrix"
    restart: "unless-stopped"


    environment:
      TZ: "Europe/Berlin"
      DB_HOST: "lyndrix.example.com"
      PYTHONUNBUFFERED: "1"
      PGID: "1000"
      DB_NAME: "lyndrix_db"
      PUID: "1000"
      ENV_TYPE: "prod"
      VAULT_URL: "https://lyndrix.example.com"
      DB_USER: "admin"
      APP_NAME: "Lyndrix"
      APP_TITLE: "Lyndrix - Feser"
      HOST_GIT_REPOS_DIR: "lyndrix.example.com"
      HOST_SECURITY_DIR: "lyndrix.example.com"
      CI_LYNDRIX_ORCHESTRATOR_URL: "https://lyndrix.example.com"
      CI_LYNDRIX_ORCHESTRATOR_TOKEN: ""
      LYNDRIX_DIRECT_TRIGGER_ENABLED: "true"
      LYNDRIX_DEPLOY_WAIT_ENABLED: "true"
      LYNDRIX_DEPLOY_WAIT_TIMEOUT_SECONDS: "1800"
      LYNDRIX_DEPLOY_WAIT_INTERVAL_SECONDS: "10"
      LYNDRIX_SYSTEM_API_KEY: "${LYNDRIX_SYSTEM_API_KEY:?set LYNDRIX_SYSTEM_API_KEY in .env (see .env.example)}"
      LYNDRIX_GATEWAY_DISCORD_DEFAULT_CHANNEL_ID: "1386158392191615056"
      LYNDRIX_GATEWAY_DISCORD_DEFAULT_BOT_TOKEN: "${LYNDRIX_GATEWAY_DISCORD_DEFAULT_BOT_TOKEN:?set LYNDRIX_GATEWAY_DISCORD_DEFAULT_BOT_TOKEN in .env (see .env.example)}"
      LYNDRIX_GATEWAY_DISCORD_DEFAULT_BOT_NAME: "Lyndrix"
      LYNDRIX_NOTIF_DEFAULT_PROVIDER: "discord"
      PLUGIN_IAC_ORCHESTRATOR_INTERNAL_GIT_REPOS_DIR: "/data/storage/git_repos"
      PLUGIN_IAC_ORCHESTRATOR_INTERNAL_SECURITY_DIR: "/data/security"
      PLUGIN_IAC_ORCHESTRATOR_INTERNAL_SERVICES_DIR: "/data/storage/services"
      PLUGIN_IAC_ORCHESTRATOR_PARALLEL_WORKERS: "20"
      PLUGIN_IAC_ORCHESTRATOR_HOST_GIT_REPOS_DIR: "lyndrix.example.com"
      PLUGIN_IAC_ORCHESTRATOR_HOST_SERVICES_DIR: "lyndrix.example.com"
      PLUGIN_IAC_ORCHESTRATOR_HOST_SECURITY_DIR: "lyndrix.example.com"
      LYNDRIX_UI_ENGINE: "api"
      LYNDRIX_CLUSTER_MODE: "single"
      LYNDRIX_INSTANCE_ID: "lyndrix"
      LYNDRIX_INSTANCE_ROLES: "api,leader,runner"
      LYNDRIX_TRUSTED_PROXIES: "*"
      CORS_ALLOWED_ORIGINS: "[\"https://mngm.example.com\"]"
      LYNDRIX_OIDC_REDIRECT_URI: "https://mngm.example.com/auth/callback/oidc"
      STORAGE_SECRET: "${STORAGE_SECRET:?set STORAGE_SECRET in .env (see .env.example)}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}"
      LYNDRIX_MASTER_KEY: "${LYNDRIX_MASTER_KEY:?set LYNDRIX_MASTER_KEY in .env (see .env.example)}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env (see .env.example)}"
      MARIADB_DATABASE: "lyndrix_db"
      MARIADB_USER: "admin"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env (see .env.example)}"
      LYNDRIX_ADMIN_PASSWORD: ""
      LYNDRIX_BOT_PASSWORD: ""

    ports:
      - "8081:8081/tcp"
      - "5173:5173/tcp"

    volumes:
      - "/export/docker/aac-lyndrix-core/storage:/data/storage"
      - "/export/docker/aac-lyndrix-core/plugins:/app/plugins"
      - "/export/docker/aac-lyndrix-core/secure_data:/data/security"
      - "/var/run/docker.sock:/var/run/docker.sock"

    networks:
      - exposed
      - interconnect
      - secured
      - stack_internal

    labels:
      traefik.enable: "true"
      traefik.http.routers.aac-lyndrix-core.rule: "Host(`lyndrix.example.com`)"
      traefik.http.routers.aac-lyndrix-core.entrypoints: "websecure"
      traefik.http.routers.aac-lyndrix-core.tls: "true"
      traefik.http.routers.aac-lyndrix-core.tls.certresolver: "ionos"
      traefik.docker.network: "services-secured"
      traefik.http.services.aac-lyndrix-core.loadbalancer.server.port: "8081"
      traefik.http.services.aac-lyndrix-core.loadbalancer.server.scheme: "http"
      auto-dns.createWildcard.aac-lyndrix-core: "true"
      auto-dns.customDNS.aac-lyndrix-core: "true"
      auto-dns.customDOMAIN.aac-lyndrix-core: "example.com"
      auto-dns.customHost.aac-lyndrix-core: "lyndrix"
      homepage.group: "Management"
      homepage.name: "Lyndrix Core"
      homepage.href: "https://lyndrix.example.com"
      homepage.icon: "/icons/lyndrix-core.png"
      homepage.description: "Lyndrix Core Application"


    sysctls:
      net.ipv4.tcp_retries2: '8'
    depends_on:
      aac-lyndrix-runner:
        condition: service_started
      aac-lyndrix-ui:
        condition: service_started
      aac-lyndrix-db:
        condition: service_healthy
      aac-lyndrix-vault:
        condition: service_started


  # --- Service Dependencies (Sidecars) ---
  aac-lyndrix-runner:
    image: "ghcr.io/lyndrix-platform/lyndrix-core:1.12.0"
    container_name: "aac-lyndrix-runner"
    restart: "always"
    

    env_file:
      - .env
    environment:
      TZ: "Europe/Berlin"
      PYTHONUNBUFFERED: "1"
      PUID: "1000"
      PGID: "1000"
      ENV_TYPE: "prod"
      APP_NAME: "Lyndrix"
      APP_TITLE: "Lyndrix - Feser"
      DB_HOST: "lyndrix.example.com"
      DB_NAME: "lyndrix_db"
      DB_USER: "admin"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}"
      VAULT_URL: "https://lyndrix.example.com"
      LYNDRIX_MASTER_KEY: "${LYNDRIX_MASTER_KEY:?set LYNDRIX_MASTER_KEY in .env (see .env.example)}"
      STORAGE_SECRET: "${STORAGE_SECRET:?set STORAGE_SECRET in .env (see .env.example)}"
      LYNDRIX_SYSTEM_API_KEY: "${LYNDRIX_SYSTEM_API_KEY:?set LYNDRIX_SYSTEM_API_KEY in .env (see .env.example)}"
      LYNDRIX_ADMIN_PASSWORD: ""
      LYNDRIX_BOT_PASSWORD: ""
      LYNDRIX_UI_ENGINE: "api"
      LYNDRIX_CLUSTER_MODE: "single"
      LYNDRIX_INSTANCE_ID: "lyndrix-runner"
      LYNDRIX_INSTANCE_ROLES: "runner"
      LYNDRIX_TRUSTED_PROXIES: "*"
      HOST_GIT_REPOS_DIR: "lyndrix.example.com"
      HOST_SECURITY_DIR: "lyndrix.example.com"
      PLUGIN_IAC_ORCHESTRATOR_INTERNAL_GIT_REPOS_DIR: "/data/storage/git_repos"
      PLUGIN_IAC_ORCHESTRATOR_INTERNAL_SECURITY_DIR: "/data/security"
      PLUGIN_IAC_ORCHESTRATOR_INTERNAL_SERVICES_DIR: "/data/storage/services"
      PLUGIN_IAC_ORCHESTRATOR_PARALLEL_WORKERS: "20"
      PLUGIN_IAC_ORCHESTRATOR_HOST_GIT_REPOS_DIR: "lyndrix.example.com"
      PLUGIN_IAC_ORCHESTRATOR_HOST_SERVICES_DIR: "lyndrix.example.com"
      PLUGIN_IAC_ORCHESTRATOR_HOST_SECURITY_DIR: "lyndrix.example.com"
      LYNDRIX_GATEWAY_DISCORD_DEFAULT_CHANNEL_ID: "1386158392191615056"
      LYNDRIX_GATEWAY_DISCORD_DEFAULT_BOT_TOKEN: "${LYNDRIX_GATEWAY_DISCORD_DEFAULT_BOT_TOKEN:?set LYNDRIX_GATEWAY_DISCORD_DEFAULT_BOT_TOKEN in .env (see .env.example)}"
      LYNDRIX_GATEWAY_DISCORD_DEFAULT_BOT_NAME: "Lyndrix"
      LYNDRIX_NOTIF_DEFAULT_PROVIDER: "discord"

    ports:
      - "8082:8081/tcp"

    volumes:
      - "/export/docker/aac-lyndrix-core/storage:/data/storage"
      - "/export/docker/aac-lyndrix-core/plugins_runner:/app/plugins"
      - "/export/docker/aac-lyndrix-core/secure_data:/data/security"
      - "/var/run/docker.sock:/var/run/docker.sock"

    networks:
      - secured
      - stack_internal



    cap_add:
    - NET_RAW
    sysctls:
      net.ipv4.tcp_retries2: '8'


  aac-lyndrix-ui:
    image: "ghcr.io/lyndrix-platform/lyndrix-ui:1.8.0"
    container_name: "aac-lyndrix-ui"
    restart: "always"
    

    env_file:
      - .env
    environment:
      VITE_CORE_URL: "https://lyndrix.example.com"
      TZ: "Europe/Berlin"
      PGID: "1000"
      PUID: "1000"

    ports:
      - "8282:80/tcp"


    networks:
      - secured
      - stack_internal

    labels:
      traefik.enable: "true"
      traefik.docker.network: "services-secured"
      traefik.http.routers.lyndrix-react.rule: "Host(`mngm.example.com`)"
      traefik.http.routers.lyndrix-react.entrypoints: "websecure"
      traefik.http.routers.lyndrix-react.tls: "true"
      traefik.http.routers.lyndrix-react.tls.certresolver: "ionos"
      traefik.http.services.lyndrix-react.loadbalancer.server.port: "80"
      auto-dns.customDNS.lyndrix-react: "true"
      auto-dns.createWildcard.lyndrix-react: "true"
      auto-dns.customDOMAIN.lyndrix-react: "example.com"
      auto-dns.customHost.lyndrix-react: "mngm"



  aac-lyndrix-db:
    image: "mariadb:12.2.2"
    container_name: "aac-lyndrix-db"
    restart: "always"
    

    env_file:
      - .env
    environment:
      TZ: "Europe/Berlin"
      PGID: "1000"
      PUID: "1000"


    volumes:
      - "/export/docker/aac-lyndrix-core/db:/var/lib/mysql"

    networks:
      - stack_internal


    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s


  aac-lyndrix-vault:
    image: "hashicorp/vault:2.2.1"
    container_name: "aac-lyndrix-vault"
    restart: "always"
    
    command:
      - "server"

    env_file:
      - .env
    environment:
      VAULT_API_ADDR: "${VAULT_API_ADDR:?set VAULT_API_ADDR in .env (see .env.example)}"
      SKIP_SETCAP: "true"
      TZ: "Europe/Berlin"
      PGID: "1000"
      PUID: "1000"


    volumes:
      - "/export/docker/aac-lyndrix-core/vault_data:/vault/file"
      - "/export/docker/aac-lyndrix-core/vault_config:/vault/config"

    networks:
      - secured
      - stack_internal

    labels:
      traefik.enable: "true"
      traefik.docker.network: "services-secured"
      traefik.http.routers.lyndrix-vault.rule: "Host(`lyndrix-vault.example.com`)"
      traefik.http.routers.lyndrix-vault.entrypoints: "websecure"
      traefik.http.routers.lyndrix-vault.tls: "true"
      traefik.http.routers.lyndrix-vault.tls.certresolver: "ionos"
      traefik.http.services.lyndrix-vault.loadbalancer.server.port: "8200"
      auto-dns.customDNS.lyndrix-vault: "true"
      auto-dns.createWildcard.lyndrix-vault: "true"
      auto-dns.customDOMAIN.lyndrix-vault: "example.com"
      auto-dns.customHost.lyndrix-vault: "lyndrix-vault"


    user: root
    cap_add:
    - IPC_LOCK



networks:
  secured:
    name: "services-secured"
    external: true
  exposed:
    name: "services-exposed"
    external: true
  interconnect:
    name: "docker-default"
    external: true
  stack_internal:
    name: "aac-lyndrix-core_stack_internal"
    driver: "bridge"

